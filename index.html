<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sky Runner 3D</title>
<style>
:root{--t:env(safe-area-inset-top,0px);--b:env(safe-area-inset-bottom,0px);--l:env(safe-area-inset-left,0px);--r:env(safe-area-inset-right,0px);--p:#fffffff2;--tx:#1b2a33}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--p:#1d2830f2;--tx:#eef3f6}}
:root[data-theme=dark]{--p:#1d2830f2;--tx:#eef3f6}
html,body{margin:0;height:100%;overflow:hidden;background:#8ecae6;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font:600 14px system-ui,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:calc(12px + var(--l));top:calc(10px + var(--t));width:160px;pointer-events:none}
.r{display:flex;align-items:center;gap:6px;margin:3px 0}.r b{width:18px;font-size:13px}
.bar{flex:1;height:11px;background:#0007;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;transform-origin:left;border-radius:6px}
#hint{position:fixed;left:50%;top:calc(14px + var(--t));transform:translateX(-50%);max-width:60%;text-align:center;background:#0008;padding:8px 14px;border-radius:12px;pointer-events:none;transition:opacity .6s}
#gear{position:fixed;right:calc(12px + var(--r));top:calc(10px + var(--t));width:44px;height:44px;border-radius:50%;border:0;background:#0007;color:#fff;font-size:22px}
#shopPanel h2{margin:0}#shopPanel button{font:inherit;padding:10px;border-radius:10px;border:2px solid #2b6cb0;background:transparent;color:inherit}#shopPanel .shopItem{border:1px solid #64748b;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}#shopResult{overflow-wrap:anywhere;font-size:13px;line-height:1.4;min-height:1em}
#joy{position:fixed;left:calc(20px + var(--l));bottom:calc(24px + var(--b));width:160px;height:160px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff80;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:#ffffffc0;pointer-events:none}
.btn{position:fixed;border-radius:50%;border:2px solid #fff9;background:#2b6cb0b0;color:#fff;font:700 11px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;padding:0}
.btn span{font-size:24px;line-height:1}.btn.on{background:#f4a261e0}
#bj{width:88px;height:88px;right:calc(22px + var(--r));bottom:calc(36px + var(--b))}
#br{width:66px;height:66px;right:calc(124px + var(--r));bottom:calc(30px + var(--b))}
#bo{width:66px;height:66px;right:calc(36px + var(--r));bottom:calc(140px + var(--b))}
#menu{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:5}
#pn{background:var(--p);color:var(--tx);border-radius:16px;padding:20px;width:min(86vw,340px);max-height:90vh;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:12px}
#pn h2{margin:0}#pn button,#pn select{font:inherit;padding:10px;border-radius:10px;border:2px solid #2b6cb0;background:transparent;color:inherit}
#pn button.on{background:#2b6cb0;color:#fff}.lg{display:flex;gap:6px}.lg button{flex:1;padding:10px 2px}.langs{flex-wrap:wrap}.langs button{flex:1 1 21%;min-width:65px}
#fl{position:fixed;inset:0;background:radial-gradient(transparent 40%,#e63946);opacity:0;pointer-events:none;transition:opacity .4s}
#vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#0006)}
#fin{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;pointer-events:none;z-index:4;font-weight:900;font-size:min(17vw,120px);text-shadow:0 6px 0 #0006,0 0 30px #fff8;text-align:center;padding:0 4vw;font-family:system-ui,sans-serif}
#fin.rb{animation:hu 2s linear infinite}#fin.sm{font-size:min(8.5vw,56px);color:#fff}
@keyframes pp{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes wob{to{transform:translateY(-12px) rotate(4deg)}}@keyframes hu{to{filter:hue-rotate(360deg)}}
#again{position:fixed;left:50%;bottom:calc(14vh + var(--b));transform:translateX(-50%);z-index:4;font:700 18px system-ui,sans-serif;padding:14px 26px;border-radius:30px;border:0;background:#fff;color:#1b2a33}
#fx{font-size:12px;margin-top:4px;text-shadow:0 1px 3px #000}
#cp{display:none;flex-direction:column;gap:8px}#pn input{font:inherit;padding:10px;border-radius:10px;border:2px solid #2b6cb0;background:transparent;color:inherit;user-select:text;-webkit-user-select:text}#cm2{min-height:1.2em;font-size:13px}
#adminToggle{position:fixed;left:50%;top:calc(10px + var(--t));transform:translateX(-50%);display:none;z-index:4;font:700 13px system-ui,sans-serif;padding:9px 13px;border:2px solid #fff9;border-radius:12px;background:#0009;color:#fff}
#dev{position:fixed;left:calc(12px + var(--l));top:calc(62px + var(--t));display:none;flex-wrap:wrap;justify-content:flex-start;gap:5px;max-width:46vw;z-index:3}
#dev button{font:700 12px system-ui,sans-serif;padding:7px 9px;border-radius:10px;border:2px solid #fff9;background:#0008;color:#fff;touch-action:none}#dev button.on{background:#2ecc71d0}
#pad{position:fixed;right:calc(12px + var(--r));top:calc(62px + var(--t));display:none;grid-template-columns:repeat(3,44px);gap:4px;z-index:3}
#pad button{height:40px;border-radius:10px;border:2px solid #fff9;background:#0008;color:#fff;font-size:18px;padding:0;touch-action:none}#pad button.on{background:#f4a261e0}
@media (orientation:landscape) and (max-height:520px){
 #hud{left:calc(8px + var(--l));top:calc(6px + var(--t));width:130px}
 .r{margin:2px 0}.bar{height:9px}#fx{font-size:10px}
 #hint{top:calc(6px + var(--t));max-width:46%;padding:5px 9px;font-size:12px}
 #gear{right:calc(8px + var(--r));top:calc(6px + var(--t));width:38px;height:38px}
 #joy{left:calc(12px + var(--l));bottom:calc(12px + var(--b));width:118px;height:118px}
 #knob{width:50px;height:50px;margin:-25px}
 #bj{width:68px;height:68px;right:calc(12px + var(--r));bottom:calc(14px + var(--b))}
 #br{width:54px;height:54px;right:calc(92px + var(--r));bottom:calc(14px + var(--b))}
 #bo{width:54px;height:54px;right:calc(30px + var(--r));bottom:calc(82px + var(--b))}
 #adminToggle{top:calc(6px + var(--t));padding:7px 10px}
 #dev{top:calc(52px + var(--t));max-width:45vw}
 #pad{top:calc(52px + var(--t));grid-template-columns:repeat(3,36px);gap:3px}
 #pad button{height:34px}
}
</style></head><body>
<canvas id="c"></canvas><div id="fl"></div><div id="vg"></div><div id="fin"></div><button id="again" data-t="again" style="display:none"></button>
<div id="hud">
<div class="r"><b>❤</b><div class="bar"><i id="bh" style="background:#e63946"></i></div></div>
<div class="r"><b>⚡</b><div class="bar"><i id="bs" style="background:#ffd166"></i></div></div>
<div class="r"><b>🍎</b><div class="bar"><i id="bu" style="background:#f4a261"></i></div></div>
<div class="r"><b>💧</b><div class="bar"><i id="bt" style="background:#4cc9f0"></i></div></div>
<div id="fx"></div>
</div>
<div id="hint" data-t="hint"></div>
<button id="gear" aria-label="settings">⚙</button>
<div id="joy"><div id="knob"></div></div>
<button class="btn" id="bj"><span>⤒</span><i data-t="jump" style="font-style:normal"></i></button>
<button class="btn" id="br"><span>🏃</span><i data-t="run" style="font-style:normal"></i></button>
<button class="btn" id="bo"><span>🌀</span><i data-t="roll" style="font-style:normal"></i></button>
<button id="adminToggle" data-t="admin"></button>
<div id="dev"><button data-d="fly" data-t="dFly"></button><button data-d="clip" data-t="dClip"></button><button data-d="god" data-t="dGod"></button><button data-d="pl" data-t="dPl"></button><button data-d="low" data-t="dLow"></button><button data-d="tur" data-t="dTur"></button><button data-d="sp" data-t="dSp"></button><button data-d="fg" data-t="dFg"></button><button data-d="st" data-t="dSt"></button></div>
<div id="pad"><button data-p="l">←</button><button data-p="f">↑</button><button data-p="r">→</button><button data-p="d">▼</button><button data-p="b">↓</button><button data-p="u">▲</button></div>
<div id="menu"><div id="pn">
<h2 data-t="set"></h2>
<div data-t="lang"></div>
<div class="lg langs"><button data-l="ru">🇷🇺 Русский</button><button data-l="en">🇬🇧 English</button><button data-l="be">🇧🇾 Беларуская</button><button data-l="kk">🇰🇿 Қазақша</button><button data-l="uk">🇺🇦 Українська</button><button data-l="uz">🇺🇿 Oʻzbekcha</button><button data-l="az">🇦🇿 Azərbaycanca</button><button data-l="hy">🇦🇲 Հայերեն</button><button data-l="ky">🇰🇬 Кыргызча</button><button data-l="tg">🇹🇯 Тоҷикӣ</button><button data-l="tk">🇹🇲 Türkmençe</button><button data-l="ro">🇲🇩 Română (Moldova)</button></div>
<div data-t="chr"></div>
<div class="lg"><button data-c="m" data-t="cm"></button><button data-c="f" data-t="cf"></button></div>
<div data-t="sens"></div><input id="sens" type="range" min="0.4" max="2" step="0.1">
<div data-t="q"></div><select id="q"><option value="0" data-t="lo"></option><option value="1" data-t="hi"></option><option value="2" data-t="ul"></option></select>
<button id="cd" data-t="codes"></button>
<div id="cp"><input id="ci" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="ca" data-t="cap"></button><div id="cm2"></div></div>
<button id="rst" data-t="reset"></button><button id="x" data-t="close"></button>
</div></div>
